[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siteaudit"
version = "0.1.0"
description = "Zero-dependency web security misconfiguration auditor with SARIF output for CI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AKPAN THANKGOD" }]
keywords = ["security", "appsec", "audit", "headers", "sarif", "owasp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AKPAN-THANKGOD/siteaudit"
Issues = "https://github.com/AKPAN-THANKGOD/siteaudit/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
siteaudit = "siteaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
